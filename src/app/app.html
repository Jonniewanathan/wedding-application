<!-- Main container with an elegant, subtle gradient background using custom cream and gray colors -->
<div class="min-h-screen bg-gradient-to-br from-cream-50 to-cream-100 font-sans text-gray-700 antialiased">

      <!-- Application Title - Styled with serif font for elegance and a deep gray color -->
      <div class="text-3xl font-serif font-bold text-gray-800 tracking-wide">
        Our Wedding Journey
      </div>
      <!-- Desktop Navigation Links - Spaced out and elegant hover effects -->
      <div class="hidden md:flex space-x-8">
        <a routerLink="/save-the-date" routerLinkActive="font-bold text-gray-900 relative after:absolute after:left-0 after:bottom-[-4px] after:h-[2px] after:w-full after:bg-gold-400 after:rounded" class="text-gray-600 hover:text-gold-400 transition duration-300 relative after:absolute after:left-0 after:bottom-[-4px] after:h-[2px] after:w-0 after:bg-gold-400 after:rounded hover:after:w-full after:transition-all after:duration-300">Save the Date</a>

        <a routerLink="/travel-info" routerLinkActive="font-bold text-gray-900 relative after:absolute after:left-0 after:bottom-[-4px] after:h-[2px] after:w-full after:bg-gold-400 after:rounded" class="text-gray-600 hover:text-gold-400 transition duration-300 relative after:absolute after:left-0 after:bottom-[-4px] after:h-[2px] after:w-0 after:bg-gold-400 after:rounded hover:after:w-full after:transition-all after:duration-300">Travel Info</a>
        <a routerLink="/local-attractions" routerLinkActive="font-bold text-gray-900 relative after:absolute after:left-0 after:bottom-[-4px] after:h-[2px] after:w-full after:bg-gold-400 after:rounded" class="text-gray-600 hover:text-gold-400 transition duration-300 relative after:absolute after:left-0 after:bottom-[-4px] after:h-[2px] after:w-0 after:bg-gold-400 after:rounded hover:after:w-full after:transition-all after:duration-300">Local Guide</a>

      </div>
      <!-- Mobile Hamburger Icon - Styled for a clean look -->
      <button class="md:hidden p-3 rounded-md text-gray-600 hover:text-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-300">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>

  </header>

  <!-- Main content area with consistent padding -->
  <main class="container mx-auto p-6 md:p-10 lg:p-12">
    <router-outlet></router-outlet>

  <!-- Footer section - Clean and subtle -->
  <footer class="bg-white shadow-inner py-6 mt-16 text-center text-gray-500 rounded-t-xl border-t border-gray-100">
    &copy; {{ currentYear }} The Couple's Wedding. All rights reserved.
  </footer>
