<div class="bg-white p-2">

  <div class="text-center mb-8">
    <span class="block text-xs font-sans uppercase tracking-[0.2em] text-slate-400 mb-2">
      {{ isEditMode ? 'Update Record' : 'Management' }}
    </span>
    <h2 class="text-3xl font-serif font-medium italic text-slate-900">
      {{ isEditMode ? 'Edit Guest Details' : 'Add New Guest' }}
    </h2>
  </div>

  <form [formGroup]="guestForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-8">

    <div class="flex flex-col gap-6">
      <h3 class="text-sm font-bold uppercase tracking-widest border-b border-slate-100 pb-2 mb-2 text-slate-800">
        Personal Information
      </h3>

      <div class="grid grid-cols-2 gap-6">
        <div class="flex flex-col gap-2">
          <label for="firstName" class="text-xs font-sans uppercase tracking-widest text-slate-500">First Name</label>
          <input id="firstName" type="text" pInputText formControlName="firstName" class="w-full" />
        </div>
        <div class="flex flex-col gap-2">
          <label for="lastName" class="text-xs font-sans uppercase tracking-widest text-slate-500">Last Name</label>
          <input id="lastName" type="text" pInputText formControlName="lastName" class="w-full" />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label for="country" class="text-xs font-sans uppercase tracking-widest text-slate-500">Country of Residence</label>
        <input id="country" type="text" pInputText formControlName="countryOfResidence" class="w-full" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="notes" class="text-xs font-sans uppercase tracking-widest text-slate-500">Admin Notes</label>
        <textarea id="notes" pInputTextarea formControlName="notes" rows="2" class="w-full" placeholder="Internal use..."></textarea>
      </div>
    </div>

    @if (isEditMode) {
      <div class="flex flex-col gap-6 bg-slate-50 p-4 -mx-4 md:mx-0 md:rounded-sm">
        <h3 class="text-sm font-bold uppercase tracking-widest border-b border-slate-200 pb-2 mb-2 text-slate-800">
          RSVP & Dietary
        </h3>

        <div class="flex flex-col gap-3">
          <label class="text-xs font-sans uppercase tracking-widest text-slate-500">Attendance Status</label>
          <div class="flex gap-6">
            <div class="flex items-center gap-2">
              <p-radioButton [value]="true" formControlName="isAttending" inputId="attending"></p-radioButton>
              <label for="attending" class="text-sm">Attending</label>
            </div>
            <div class="flex items-center gap-2">
              <p-radioButton [value]="false" formControlName="isAttending" inputId="declined"></p-radioButton>
              <label for="declined" class="text-sm">Declined</label>
            </div>
            <div class="flex items-center gap-2">
              <p-radioButton [value]="null" formControlName="isAttending" inputId="pending"></p-radioButton>
              <label for="pending" class="text-sm text-slate-400">Pending</label>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <label class="text-xs font-sans uppercase tracking-widest text-slate-500">Preferences</label>
          <div class="flex flex-wrap gap-2">
            @for (opt of dietaryOptions; track opt.label) {
              <p-checkbox name="dietaryPreferences"
                          [value]="opt.value"
                          formControlName="dietaryPreferences"
                          class="chip-checkbox"
                          id="{{opt.label + '_' + guestToEdit?.id}}"
              >
              </p-checkbox>
              <label for="{{opt.label + '_' + guestToEdit?.id}}" class="ml-2">{{opt.label}}</label>
            }
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <label class="text-xs font-sans uppercase tracking-widest text-slate-500">Allergies</label>
          <div class="flex flex-wrap gap-2">
            @for (opt of allergyOptions; track opt.label) {
              <p-checkbox name="allergies"
                          [value]="opt.value"
                          formControlName="allergies"
                          class="chip-checkbox"
                          id="{{opt.label + '_' + guestToEdit?.id}}"
              >
              </p-checkbox>
              <label for="{{opt.label + '_' + guestToEdit?.id}}" class="ml-2">{{opt.label}}</label>
            }
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label for="dNotes" class="text-xs font-sans uppercase tracking-widest text-slate-500">Specific Dietary Notes</label>
          <input id="dNotes" type="text" pInputText formControlName="dietaryNotes" class="w-full text-sm" placeholder="Details provided by guest..." />
        </div>
      </div>
    }

    <div class="flex items-center justify-between mt-2 pt-6 border-t border-slate-100">
      <button type="button" (click)="onCancel()" class="text-xs uppercase tracking-widest text-slate-400 hover:text-slate-800 transition-colors">
        Cancel
      </button>

      <button type="submit" [disabled]="guestForm.invalid || isLoading" class="bg-slate-900 text-white px-6 py-3 text-xs uppercase tracking-widest hover:bg-slate-700 transition-colors disabled:opacity-50 flex items-center gap-2">
        @if(isLoading) { <i class="pi pi-spin pi-spinner"></i> }
        {{ isEditMode ? 'Update Guest' : 'Add Guest' }}
      </button>
    </div>

  </form>
</div>
