<div class="flex flex-col items-center py-8 px-4">

  <p-card class="max-w-3xl w-full shadow-xl rounded-xl border-none">
    <h1 class="text-5xl md:text-6xl font-serif text-gray-800 font-bold mb-6 text-center tracking-tight">
      {{ pageTitle }}
    </h1>
    <p class="text-lg md:text-xl text-gray-600 mb-10 text-center max-w-2xl mx-auto leading-relaxed">
      {{ introText }}
    </p>

    <form [formGroup]="rsvpForm" (ngSubmit)="submitRsvp()" class="space-y-8">

      <div>
        <label for="guestName" class="block text-xl font-semibold text-gray-700 mb-3 font-serif">Your Name(s)</label>
        <input id="guestName" type="text" pInputText formControlName="guestName" class="w-full"
               placeholder="e.g., John & Jane Doe"/>
        <small class="block mt-2 text-gray-500">Please include all names in your party.</small>
      </div>

      <div>
        <span class="block text-xl font-semibold text-gray-700 mb-4 font-serif">Will you be able to join us?</span>
        <div class="flex flex-wrap gap-6 mt-2">
          <div class="flex items-center">
            <p-radioButton id="accepts" name="attending" value="yes" formControlName="attending" inputId="accepts"></p-radioButton>
            <label for="accepts" class="ml-2 text-lg">Joyfully Accepts</label>
          </div>
          <div class="flex items-center">
            <p-radioButton id="declines" name="attending" value="no" formControlName="attending" inputId="declines"></p-radioButton>
            <label for="declines" class="ml-2 text-lg">Regretfully Declines</label>
          </div>
        </div>
      </div>

      @if (rsvpForm.get('attending')?.value === 'yes') {
        <div class="flex items-center justify-between p-4 rounded-lg bg-cream-50 border">
          <span class="text-xl font-semibold text-gray-700 font-serif">Will you be bringing a plus one?</span>
          <p-toggleswitch formControlName="plusOne" />
        </div>

        @if (rsvpForm.get('plusOne')?.value) {
          <div>
            <label for="plusOneName" class="block text-xl font-semibold text-gray-700 mb-3 font-serif">Plus One's Name</label>
            <input id="plusOneName" type="text" pInputText formControlName="plusOneName" class="w-full" />
          </div>
        }
      }

      <div>
        <label for="dietary" class="block text-xl font-semibold text-gray-700 mb-3 font-serif">Dietary Restrictions or Special Requests</label>
        <textarea id="dietary" pInputTextarea formControlName="dietaryRestrictions" rows="4" class="w-full"
                  placeholder="e.g., allergies, dietary needs..."></textarea>
      </div>

      <div>
        <label for="message" class="block text-xl font-semibold text-gray-700 mb-3 font-serif">A message for the couple (optional)</label>
        <textarea id="message" pInputTextarea formControlName="message" rows="4" class="w-full"></textarea>
      </div>

      <div class="text-center pt-4">
        <p-button type="submit" label="Submit RSVP" [disabled]="rsvpForm.invalid"
                  size="large"
                  raised="true"
                  rounded="true"
                  styleClass="shadow-lg bg-rose-400 hover:bg-rose-500 transition duration-300 ease-in-out transform hover:scale-105">
        </p-button>
      </div>
    </form>
  </p-card>
</div>
