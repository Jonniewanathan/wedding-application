<p-toast></p-toast>

<div class="flex flex-col items-center py-8 px-4">

  <p-card class="max-w-4xl w-full shadow-xl rounded-xl border-none text-center">

    <h1 class="text-5xl md:text-6xl font-serif text-gray-800 font-bold mb-6 tracking-tight">
      {{ pageTitle }}
    </h1>
    <p class="text-lg md:text-xl text-gray-600 mb-8 max-w-2xl mx-auto leading-relaxed">
      {{ introText }}
    </p>

    <p-fileUpload
      name="weddingPhotos[]"
      (onUpload)="onUpload($event)"
      [multiple]="true"
      accept="image/*"
      [maxFileSize]="10000000"
      [customUpload]="true"
      styleClass="bg-cream-50 p-8 rounded-lg shadow-md border border-cream-100">

      <ng-template pTemplate="content">
        <div class="flex flex-col items-center justify-center space-y-4">
          <i class="pi pi-cloud-upload text-gold-400 text-6xl"></i>
          <p class="text-xl font-semibold text-gray-700">Drag & Drop Your Photos Here</p>
          <p class="text-gray-500">or click to browse</p>
        </div>
      </ng-template>
    </p-fileUpload>
    <p class="text-md text-gray-500 mt-6 italic">
      {{ disclaimerText }}
    </p>

    <section class="mt-12 text-left">
      <h2 class="text-3xl font-serif text-gray-700 mb-8 text-center">A Sneak Peek of Shared Moments</h2>
      <p-galleria [value]="mockPhotos" [numVisible]="5" [circular]="true" [showThumbnails]="false"
                  [showItemNavigators]="true" [showItemNavigatorsOnHover]="true"
                  [containerStyle]="{ 'max-width': '100%' }">
        <ng-template pTemplate="item" let-item>
          <img [src]="item.itemImageSrc" [alt]="item.alt" style="width: 100%; display: block;" class="rounded-lg"/>
        </ng-template>
      </p-galleria>
      <p class="text-md text-gray-500 italic mt-8 text-center">
        Actual photos will appear here once the feature is live after the wedding.
      </p>
    </section>

  </p-card>
</div>
