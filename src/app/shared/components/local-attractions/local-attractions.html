<div class="flex flex-col items-center py-8 px-4">
  <p-card class="max-w-6xl w-full shadow-xl rounded-xl border-none">
    <h1 class="text-5xl md:text-6xl font-serif text-gray-800 font-bold mb-6 text-center tracking-tight">
      {{ pageTitle }}
    </h1>
    <p class="text-lg md:text-xl text-gray-600 mb-12 text-center max-w-3xl mx-auto leading-relaxed">
      {{ introText }}
    </p>
    <section class="mb-12">
      <h2 class="text-3xl font-serif text-gray-700 mb-6 text-center">Map of the Area</h2>
      <div class="w-full h-150 rounded-lg overflow-hidden shadow-md border">
        @if (mapReady) {
          <google-map
            height="100%"
            width="100%"
            [center]="mapCenter"
            [zoom]="mapZoom">
          </google-map>
        }
      </div>
    </section>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (attraction of attractions; track attraction.name) {
        <p-card class="bg-cream-50 rounded-lg shadow-md border border-cream-100 overflow-hidden hover:shadow-lg transition duration-300 transform hover:-translate-y-1">
          <ng-template pTemplate="header">
            <p-image [src]="attraction.image" [alt]="attraction.name" imageClass="w-full object-cover" [preview]="true"></p-image>
          </ng-template>
          <h3 class="text-2xl font-serif text-gray-800 font-semibold mb-3">{{ attraction.name }}</h3>
          <p class="text-md text-gray-600">{{ attraction.description }}</p>
          <ng-template pTemplate="footer">
            <p-button
              label="Learn More"
              icon="pi pi-external-link"
              (click)="navigateTo(attraction.link)"
              styleClass="bg-gold-300 hover:bg-gold-400 text-gray-800 border-none"
              rounded="true"
              raised="true"
            >
            </p-button>
          </ng-template>
        </p-card>
      }
    </div>
  </p-card>
</div>
