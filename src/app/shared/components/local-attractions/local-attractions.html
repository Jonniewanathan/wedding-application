<div class="w-full bg-white text-slate-900 py-16 md:py-24">

  <div class="container mx-auto px-6 md:px-12 mb-16 md:mb-24 text-center max-w-4xl" appScrollReveal>

    <span class="block text-xs md:text-sm font-sans uppercase tracking-[0.3em] text-slate-500 mb-6">
      Guide
    </span>

    <h1 class="text-5xl md:text-7xl lg:text-8xl font-serif font-medium italic text-slate-900 mb-8 leading-none tracking-tight">
      {{ pageTitle }}
    </h1>

    <div class="h-px w-24 bg-slate-300 mx-auto mb-8"></div>

    <p class="text-lg text-slate-600 font-light leading-relaxed max-w-2xl mx-auto">
      {{ introText }}
    </p>
  </div>

  <section class="container mx-auto px-6 md:px-12 mb-20 md:mb-32" appScrollReveal>
    <div class="w-full h-[400px] md:h-[500px] bg-slate-100 transition-all duration-1000 ease-in-out shadow-lg shadow-slate-200/50 rounded-sm overflow-hidden border border-slate-100">
      @if (mapReady) {
        <google-map
          height="100%"
          width="100%"
          [center]="mapCenter"
          [zoom]="mapZoom"
          [options]="mapOptions">
        </google-map>
      }
    </div>
    <p class="text-center text-xs uppercase tracking-widest text-slate-400 mt-6">
      Explore the Region
    </p>
  </section>

  <div class="container mx-auto px-6 md:px-12">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-20">

      @for (attraction of attractions; track attraction.name) {
        <div class="group flex flex-col">

          <div class="relative overflow-hidden aspect-[4/3] mb-8 bg-slate-50 editorial-image-hover reveal-delay-100" appScrollReveal>
            <img
              [src]="attraction.image"
              [alt]="attraction.name"
              class="object-cover w-full h-full"
            />
          </div>

          <div class="text-center">
            <h3 class="text-2xl font-serif text-slate-900 mb-3 group-hover:text-slate-600 transition-colors">
              {{ attraction.name }}
            </h3>
            <p class="text-slate-500 font-sans font-light leading-relaxed mb-6 px-4">
              {{ attraction.description }}
            </p>
          </div>

        </div>
      }
    </div>
  </div>
</div>
