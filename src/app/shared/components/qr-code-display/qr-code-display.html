<div class="flex flex-col items-center p-4">

  <p class="text-lg font-semibold mb-4 text-center">Invitation Link & QR Code</p>

  <div class="mb-6">
    @if (qrCodeDataUrl) {
      <img [src]="qrCodeDataUrl" alt="Invitation QR Code" class="w-48 h-48 md:w-64 md:h-64 border rounded-md shadow-sm">
    } @else {
      <p class="text-red-500">QR Code could not be generated.</p>
    }
  </div>

  <div class="w-full max-w-md mb-6">
    <label for="invitationUrl" class="block text-sm font-medium text-gray-700 mb-1">Invitation URL:</label>
    <p-input-group>
      <input #urlInput id="invitationUrl" type="text" pInputText [value]="invitationUrl" readonly class="p-inputtext-sm">
      <p-button type="button" icon="pi pi-copy" (click)="copyUrl(urlInput)" pTooltip="Copy URL" tooltipPosition="top"></p-button>
    </p-input-group>
  </div>

  <p-button label="Close" (onClick)="closeDialog()" severity="secondary"></p-button>

</div>
