<div class="p-fluid">
  <h3 class="font-semibold text-lg mb-4">Create New Invitation</h3>
  <p class="mb-4 text-gray-600">You are creating an invitation for:</p>
  <div class="flex flex-wrap gap-2 mb-6">
    @for(guest of guestsToAssign; track guest.id){
      <p-chip [label]="guest.firstName + ' ' + guest.lastName" icon="pi pi-user"></p-chip>
    }
  </div>

  <form [formGroup]="invitationForm" (ngSubmit)="onSubmit()">
    <div class="field mb-4">
      <label for="displayName" class="font-semibold">Display Name</label>
      <input id="displayName" type="text" pInputText formControlName="displayName" placeholder="e.g., The Smith Family" />
    </div>

    <div class="field mb-4">
      <label for="invitationCode" class="font-semibold">Invitation Code (URL)</label>
      <input id="invitationCode" type="text" pInputText formControlName="invitationCode" placeholder="e.g., the-smiths" />
      <small class="block mt-1 text-gray-500">Use lowercase letters, numbers, and hyphens only.</small>
    </div>

    <div class="flex justify-end gap-2 mt-6">
      <p-button label="Cancel" (click)="onCancel()" severity="secondary"></p-button>
      <p-button type="submit" label="Create Invitation" [disabled]="invitationForm.invalid"></p-button>
    </div>
  </form>
</div>
