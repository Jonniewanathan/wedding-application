<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="p-8 bg-white rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Admin Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="email" class="block text-gray-700 mb-2">Email</label>
        <input id="email" type="email" pInputText formControlName="email" class="w-full" />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-gray-700 mb-2">Password</label>
        <input id="password" type="password" pInputText formControlName="password" class="w-full" />
      </div>
      <p-button label="Login" type="submit" [disabled]="loginForm.invalid" styleClass="w-full"></p-button>

      <div *ngIf="errorMessage" class="mt-4 p-2 bg-red-100 text-red-700 rounded">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
