<div class="py-6">

  <div class="flex justify-between items-center mb-6">
    <p class="text-sm text-slate-500 font-light max-w-md">
      Guests listed here are waiting to be grouped into an invitation. Select guests to create a new group.
    </p>

    <div class="relative w-full md:w-auto">
      <p-inputgroup>
        <p-inputgroup-addon>
          <i class="pi pi-search"></i>
        </p-inputgroup-addon>
        <input
          type="text"
          pInputText
          (input)="filterGuests(dt, $event)"
          placeholder="Search guests..."
          class="pl-10 w-full md:w-64 text-sm border-slate-200"
        />
      </p-inputgroup>
    </div>

    <div class="flex gap-3">
      <input
        type="file"
        #csvInput
        (change)="handleCsvUpload($event)"
        accept=".csv"
        style="display: none;"
      />

      <button
        (click)="csvInput.click()"
        class="bg-white border border-slate-200 text-slate-800 px-4 py-3 text-[10px] uppercase tracking-widest hover:bg-slate-50 transition-colors shadow-sm">
        <i class="pi pi-upload mr-2"></i> Upload CSV
      </button>

      <button
        (click)="openAddGuestForm()"
        class="bg-slate-900 text-white px-6 py-3 text-[10px] uppercase tracking-widest hover:bg-slate-700 transition-colors shadow-lg shadow-slate-200">
        + Add New Guest
      </button>
    </div>
  </div>

  <p-table #dt [value]="(unassignedGuests$ | async)!"
           [selection]="selectedGuests"
           (selectionChange)="selectedGuests = $event"
           dataKey="id"
           [paginator]="true"
           [rows]="10"
           class="editorial-table"
           [globalFilterFields]="['firstName', 'lastName', 'countryOfResidence']">

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 3rem"><p-tableHeaderCheckbox></p-tableHeaderCheckbox></th>

        <th pSortableColumn="firstName" class="cursor-pointer hover:text-slate-900 transition-colors">
          First Name <p-sortIcon field="firstName"></p-sortIcon>
        </th>

        <th pSortableColumn="lastName" class="cursor-pointer hover:text-slate-900 transition-colors">
          Last Name <p-sortIcon field="lastName"></p-sortIcon>
        </th>

        <th pSortableColumn="countryOfResidence" class="cursor-pointer hover:text-slate-900 transition-colors">
          Country <p-sortIcon field="countryOfResidence"></p-sortIcon>
        </th>

        <th>Status</th>
        <th class="text-right">Action</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-guest>
      <tr class="hover:bg-slate-50 transition-colors">
        <td><p-tableCheckbox [value]="guest"></p-tableCheckbox></td>

        <td class="font-semibold text-slate-900">{{ guest.firstName }}</td>

        <td class="font-semibold text-slate-900">{{ guest.lastName }}</td>

        <td>{{ guest.countryOfResidence || '-' }}</td>

        <td>
          <span class="text-[10px] uppercase tracking-widest text-slate-400 bg-slate-50 px-2 py-1">Unassigned</span>
        </td>
        <td class="text-right">
          <div class="flex justify-end gap-2">

            <button
              (click)="onEditGuest(guest)"
              class="text-slate-300 hover:text-slate-900 transition-colors p-2"
              pTooltip="Edit Details">
              <i class="pi pi-pencil"></i>
            </button>

            <button
              (click)="onDeleteUnassignedGuest(guest)"
              class="text-slate-300 hover:text-red-500 transition-colors p-2"
              pTooltip="Remove Guest">
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- sticky footer for actions based on selection -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)] z-50 flex justify-center items-center gap-6"
       *ngIf="selectedGuests && selectedGuests.length > 0">

    <span class="text-xs text-slate-500 uppercase tracking-widest font-medium">
      {{ selectedGuests.length }} Guests Selected
    </span>

    <button
      (click)="openInvitationForm()"
      class="bg-slate-900 text-white px-8 py-3 text-xs uppercase tracking-widest font-bold hover:bg-slate-800 transition-colors shadow-lg">
      Create Invitation Group &rarr;
    </button>
  </div>

</div>
