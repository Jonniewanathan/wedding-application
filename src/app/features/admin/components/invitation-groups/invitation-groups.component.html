<div class="py-6">

  <div class="flex justify-between items-center mb-6">
    <p class="text-sm text-slate-500 font-light max-w-md">
      Manage finalized invitations, track RSVPs, and view QR codes.
    </p>

    <div class="relative w-full md:w-auto">
      <i class="pi pi-search absolute left-3 top-3 text-slate-400"></i>
      <input
        type="text"
        (input)="filterInvitations(dtGroups, $event)"
        placeholder="Search groups..."
        class="pl-10 w-full md:w-64 text-sm border-slate-200"
      />
    </div>
  </div>

  <p-table #dtGroups [value]="(invitations$ | async)!" [paginator]="true" [rows]="10" styleClass="editorial-table" [globalFilterFields]="['displayName', 'invitationCode']">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="displayName" class="cursor-pointer hover:text-slate-900 transition-colors">
          Group Display Name <p-sortIcon field="displayName"></p-sortIcon>
        </th>
        <th pSortableColumn="invitationCode" class="cursor-pointer hover:text-slate-900 transition-colors">
          Access Code <p-sortIcon field="invitationCode"></p-sortIcon>
        </th>
        <th pSortableColumn="hasResponded" class="cursor-pointer hover:text-slate-900 transition-colors">
          RSVP Status <p-sortIcon field="hasResponded"></p-sortIcon>
        </th>
        <th class="text-right">Manage</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-invitation>
      <tr class="hover:bg-slate-50 transition-colors">
        <td>
          <span class="font-medium text-lg text-slate-900 font-serif italic">{{ invitation.displayName }}</span>
        </td>
        <td>
          <span class="font-mono text-xs bg-slate-100 px-3 py-1 text-slate-600 border border-slate-200">{{ invitation.invitationCode }}</span>
        </td>
        <td>
          @if(invitation.hasResponded) {
            <span class="text-[10px] uppercase tracking-widest bg-green-50 text-green-700 px-2 py-1 border border-green-100">Responded</span>
          } @else {
            <span class="text-[10px] uppercase tracking-widest text-slate-400 bg-slate-50 px-2 py-1">Pending</span>
          }
        </td>
        <td class="text-right">
          <div class="flex items-center justify-end gap-4">

            <button
              (click)="onAddGuestsToInvitation(invitation)"
              [disabled]="selectedGuests.length === 0"
              [class.text-slate-200]="selectedGuests.length === 0"
              [class.hover:text-slate-900]="selectedGuests.length > 0"
              [class.text-slate-400]="selectedGuests.length > 0"
              class="transition-colors"
              pTooltip="Add Selected Guests from Pool">
              <i class="pi pi-user-plus"></i>
            </button>

            <button (click)="openViewGuests(invitation)" class="text-slate-400 hover:text-slate-900 transition-colors" tooltipPosition="top" pTooltip="View Guests in Group">
              <i class="pi pi-users"></i>
            </button>

            <button (click)="showQrCodeDialog(invitation)" class="text-slate-400 hover:text-slate-900 transition-colors" tooltipPosition="top" pTooltip="Get QR Link">
              <i class="pi pi-qrcode"></i>
            </button>

            <button (click)="onDeleteInvitation(invitation)" class="text-slate-300 hover:text-red-500 transition-colors" tooltipPosition="top" pTooltip="Delete Group">
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

</div>
