<div class="py-4 md:py-6">

  <div class="flex flex-col md:flex-row justify-end items-start md:items-center gap-4 mb-6">
    <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
      <!-- Status Filter Dropdown -->
      <p-select
        [options]="statusOptions"
        (onChange)="onStatusFilterChange(dtGroups, $event)"
        placeholder="Filter by Status"
        class="w-full sm:w-auto md:w-48 text-sm">
      </p-select>

      <!-- Global Search Input -->
      <div class="w-full md:w-auto relative">
        <p-inputgroup>
          <input
            pInputText
            pButtonIcon="pi pi-search"
            type="text"
            (input)="filterInvitations(dtGroups, $event)"
            placeholder="Search groups..."
            class="pl-10 w-full md:w-64 text-sm border-slate-200 p-2"
          />
          <p-inputgroup-addon>
            <i class="pi pi-search"></i>
          </p-inputgroup-addon>
        </p-inputgroup>
      </div>
    </div>
  </div>

  <div class="w-full overflow-x-auto -mx-6 md:mx-0 px-6 md:px-0">
    <p-table #dtGroups [value]="(invitations$ | async)!" [paginator]="true" [rows]="10" class="editorial-table min-w-[600px]" [globalFilterFields]="['displayName', 'invitationCode']">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="displayName" class="cursor-pointer hover:text-slate-900 transition-colors">
            Group Display Name <p-sortIcon field="displayName"></p-sortIcon>
          </th>
          <th pSortableColumn="invitationCode" class="cursor-pointer hover:text-slate-900 transition-colors">
            Access Code <p-sortIcon field="invitationCode"></p-sortIcon>
          </th>
          <th pSortableColumn="hasResponded" class="cursor-pointer hover:text-slate-900 transition-colors">
            RSVP Status
            <!-- Keeping the column filter definition so the table knows it can filter this column, but hiding the menu icon -->
            <p-columnFilter field="hasResponded" matchMode="equals" display="menu" [showMenu]="false"></p-columnFilter>
          </th>
          <th class="text-right">Manage</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-invitation>
        <tr class="hover:bg-slate-50 transition-colors">
          <td>
            <span class="font-medium text-lg text-slate-900 font-serif italic">{{ invitation.displayName }}</span>
          </td>
          <td>
            <span class="font-mono text-xs bg-slate-100 px-3 py-1 text-slate-600 border border-slate-200">{{ invitation.invitationCode }}</span>
          </td>
          <td>
            @if(invitation.hasResponded) {
              <span class="text-[10px] uppercase tracking-widest bg-green-50 text-green-700 px-2 py-1 border border-green-100">Responded</span>
            } @else {
              <span class="text-[10px] uppercase tracking-widest text-slate-400 bg-slate-50 px-2 py-1">Pending</span>
            }
          </td>
          <td class="text-right">
            <div class="flex items-center justify-end gap-2">

              <button
                (click)="onAddGuestsToInvitation(invitation)"
                [disabled]="selectedGuests.length === 0"
                [class.text-slate-200]="selectedGuests.length === 0"
                [class.hover:text-slate-900]="selectedGuests.length > 0"
                [class.text-slate-400]="selectedGuests.length > 0"
                class="transition-colors p-2"
                pTooltip="Add Selected Guests" tooltipPosition="top">
                <i class="pi pi-user-plus"></i>
              </button>

              <button (click)="editInvitation(invitation)" class="text-slate-400 hover:text-slate-900 transition-colors p-2" tooltipPosition="top" pTooltip="Edit Group Details">
                <i class="pi pi-pencil"></i>
              </button>

              <button (click)="openViewGuests(invitation)" class="text-slate-400 hover:text-slate-900 transition-colors p-2" tooltipPosition="top" pTooltip="View Guests">
                <i class="pi pi-users"></i>
              </button>

              <button (click)="showQrCodeDialog(invitation)" class="text-slate-400 hover:text-slate-900 transition-colors p-2" tooltipPosition="top" pTooltip="Get QR Link">
                <i class="pi pi-qrcode"></i>
              </button>

              <button (click)="onDeleteInvitation(invitation)" class="text-slate-300 hover:text-red-500 transition-colors p-2" tooltipPosition="top" pTooltip="Delete Group">
                <i class="pi pi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
