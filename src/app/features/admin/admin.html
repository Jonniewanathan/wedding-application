<p-toast></p-toast>
<p-confirmDialog [style]="{width: '50vw'}" rejectButtonStyleClass="p-button-text text-slate-500" acceptButtonStyleClass="bg-slate-900 border-slate-900 text-white"></p-confirmDialog>

<div class="min-h-screen bg-white text-slate-900 p-6 md:p-12">

  <header class="flex flex-col md:flex-row justify-between items-end border-b border-slate-100 pb-8 mb-10">
    <div>
      <span class="block text-xs font-sans uppercase tracking-[0.3em] text-slate-500 mb-2">
        Admin Suite
      </span>
      <h1 class="text-4xl md:text-5xl font-serif font-medium italic text-slate-900 leading-none">
        Guest Management
      </h1>
    </div>

    <button
      (click)="logout()"
      class="mt-6 md:mt-0 text-xs uppercase tracking-widest text-slate-400 hover:text-red-600 transition-colors border-b border-transparent hover:border-red-600 pb-1">
      Log Out
    </button>
  </header>

  <!-- Custom Tabs for Eager Loading -->
  <div class="editorial-tabs mb-4">
    <div class="p-tablist flex space-x-4 border-b border-slate-200">
      <button
        (click)="activeTabIndex = 0"
        [class.border-b-2]="activeTabIndex === 0"
        [class.border-slate-900]="activeTabIndex === 0"
        [class.text-slate-900]="activeTabIndex === 0"
        [class.font-medium]="activeTabIndex === 0"
        class="pb-2 text-sm text-slate-500 hover:text-slate-800 transition-colors uppercase tracking-widest">
        Guest Pool
      </button>
      <button
        (click)="activeTabIndex = 1"
        [class.border-b-2]="activeTabIndex === 1"
        [class.border-slate-900]="activeTabIndex === 1"
        [class.text-slate-900]="activeTabIndex === 1"
        [class.font-medium]="activeTabIndex === 1"
        class="pb-2 text-sm text-slate-500 hover:text-slate-800 transition-colors uppercase tracking-widest">
        Invitation Groups
      </button>
    </div>
  </div>

  <div>
    <!-- Render both, but hide the inactive one -->
    <div [style.display]="activeTabIndex === 0 ? 'block' : 'none'">
      <app-guest-pool></app-guest-pool>
    </div>
    <div [style.display]="activeTabIndex === 1 ? 'block' : 'none'">
      <app-invitation-groups></app-invitation-groups>
    </div>
  </div>

</div>
