<p-toast></p-toast>
<p-confirmDialog [style]="{width: '90vw', maxWidth: '500px'}" rejectButtonStyleClass="p-button-text text-slate-500" acceptButtonStyleClass="bg-slate-900 border-slate-900 text-white"></p-confirmDialog>

<div class="min-h-screen bg-white text-slate-900 p-4 md:p-6 lg:p-12 pb-24">

  <header class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-slate-100 pb-6 md:pb-8 mb-8 md:mb-10 gap-4">
    <div>
      <span class="block text-xs font-sans uppercase tracking-[0.3em] text-slate-500 mb-2">
        Admin Suite
      </span>
      <h1 class="text-3xl md:text-4xl lg:text-5xl font-serif font-medium italic text-slate-900 leading-none">
        Guest Management
      </h1>
    </div>

    <button
      (click)="logout()"
      class="text-xs uppercase tracking-widest text-slate-400 hover:text-red-600 transition-colors border-b border-transparent hover:border-red-600 pb-1">
      Log Out
    </button>
  </header>

  <!-- Custom Tabs for Eager Loading -->
  <div class="editorial-tabs mb-4 w-full overflow-x-auto border-b border-slate-200">
    <div class="p-tablist flex space-x-6 min-w-max">
      <button
        (click)="activeTabIndex = 0"
        [class.border-b-2]="activeTabIndex === 0"
        [class.border-slate-900]="activeTabIndex === 0"
        [class.text-slate-900]="activeTabIndex === 0"
        [class.font-medium]="activeTabIndex === 0"
        class="pb-2 text-xs md:text-sm text-slate-500 hover:text-slate-800 transition-colors uppercase tracking-widest border-b-2 border-transparent">
        Guest Pool
      </button>
      <button
        (click)="activeTabIndex = 1"
        [class.border-b-2]="activeTabIndex === 1"
        [class.border-slate-900]="activeTabIndex === 1"
        [class.text-slate-900]="activeTabIndex === 1"
        [class.font-medium]="activeTabIndex === 1"
        class="pb-2 text-xs md:text-sm text-slate-500 hover:text-slate-800 transition-colors uppercase tracking-widest border-b-2 border-transparent">
        Invitation Groups
      </button>
      <button
        (click)="activeTabIndex = 2"
        [class.border-b-2]="activeTabIndex === 2"
        [class.border-slate-900]="activeTabIndex === 2"
        [class.text-slate-900]="activeTabIndex === 2"
        [class.font-medium]="activeTabIndex === 2"
        class="pb-2 text-xs md:text-sm text-slate-500 hover:text-slate-800 transition-colors uppercase tracking-widest border-b-2 border-transparent">
        Stats & Export
      </button>
      <button
        (click)="activeTabIndex = 3"
        [class.border-b-2]="activeTabIndex === 3"
        [class.border-slate-900]="activeTabIndex === 3"
        [class.text-slate-900]="activeTabIndex === 3"
        [class.font-medium]="activeTabIndex === 3"
        class="pb-2 text-xs md:text-sm text-slate-500 hover:text-slate-800 transition-colors uppercase tracking-widest border-b-2 border-transparent">
        Stats V2
        <span class="ml-1 text-[8px] text-amber-600 uppercase tracking-widest">Preview</span>
      </button>
    </div>
  </div>

  <div class="mt-4">
    <!-- Render both, but hide the inactive one -->
    <div [class.hidden]="activeTabIndex !== 0">
      <app-guest-pool></app-guest-pool>
    </div>
    <div [class.hidden]="activeTabIndex !== 1">
      <app-invitation-groups></app-invitation-groups>
    </div>
    <!-- IMPORTANT FIX: Use *ngIf for charts. Chart.js fails to initialize correctly if its container starts with display: none -->
    @if (activeTabIndex === 2) {
      <app-stats></app-stats>
    }
    @if (activeTabIndex === 3) {
      <app-stats-v2></app-stats-v2>
    }
  </div>

</div>
